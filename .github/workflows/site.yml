# Publica o site (pasta site/) no GitHub Pages sempre que ele muda.
name: Publicar site

on:
  push:
    branches: [claude/great-pasteur-y7qbv5]
    paths: ['site/**', 'update.json', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # O ícone já está em play-store/: copia em vez de duplicar no repositório.
      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp play-store/icon/pushlife-icon.svg _site/assets/icon.svg
          cp play-store/icon/pushlife-icon-512.png _site/assets/icon-512.png
          # mesmo arquivo que o app lê: o site mostra o aviso de versão nova
          cp update.json _site/update.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
