name: Gerar APK

on:
  push:
    branches: [claude/great-pasteur-y7qbv5, main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar e testar
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PushLife.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PushLife-apk
          path: PushLife.apk

      # Cada build vira uma "release" no GitHub; o link .../releases/latest/download/PushLife.apk
      # sempre baixa a versão mais nova, direto pelo navegador do celular.
      - name: Publicar APK para baixar no celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" PushLife.apk \
            --target "${{ github.sha }}" \
            --title "PushLife (teste) #${{ github.run_number }}" \
            --notes "Versão de teste gerada automaticamente a partir de ${{ github.sha }}." \
            --latest
