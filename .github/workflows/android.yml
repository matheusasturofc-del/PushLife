name: Gerar APK

on:
  push:
    branches: [claude/great-pasteur-y7qbv5, main]
    paths-ignore: ['**.md', 'update.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar e testar
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PushLife.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PushLife-apk
          path: PushLife.apk

      # Versão para a Play Store (AAB), só quando os segredos da chave de publicação existem.
      - name: Gerar pacote da Play Store
        env:
          KEYSTORE_BASE64: ${{ secrets.PUSHLIFE_KEYSTORE_BASE64 }}
          PUSHLIFE_KEYSTORE_PASSWORD: ${{ secrets.PUSHLIFE_KEYSTORE_PASSWORD }}
          PUSHLIFE_KEY_ALIAS: ${{ secrets.PUSHLIFE_KEY_ALIAS }}
          PUSHLIFE_KEY_PASSWORD: ${{ secrets.PUSHLIFE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sem chave de publicação cadastrada: pulando o pacote da Play Store."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          PUSHLIFE_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab PushLife-playstore.aab

      - name: Guardar pacote da Play Store
        uses: actions/upload-artifact@v4
        with:
          name: PushLife-playstore
          path: PushLife-playstore.aab
          if-no-files-found: ignore

      # Cada build vira uma "release" no GitHub; o link .../releases/latest/download/PushLife.apk
      # sempre baixa a versão mais nova, direto pelo navegador do celular.
      - name: Publicar APK para baixar no celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" PushLife.apk \
            --target "${{ github.sha }}" \
            --title "PushLife (teste) #${{ github.run_number }} · versionCode $((${{ github.run_number }} + 100))" \
            --notes "Versão de teste gerada automaticamente a partir de ${{ github.sha }}. versionCode: $((${{ github.run_number }} + 100)) (é este número que vai no update.json)." \
            --latest
