<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PushLife — troque a rolagem por flexões</title>
  <meta name="description" content="O PushLife bloqueia os apps que roubam seu tempo. Cada flexão vale 1 minuto para usar neles. A câmera conta para você. Grátis e sem anúncios.">
  <meta name="theme-color" content="#1a1208">
  <meta property="og:title" content="PushLife — troque a rolagem por flexões">
  <meta property="og:description" content="Cada flexão vale 1 minuto de tela. A câmera conta para você.">
  <meta property="og:image" content="assets/icon-512.png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip" href="#conteudo" data-i18n="skip">Pular para o conteúdo</a>
  <div class="progress" aria-hidden="true"></div>

  <header class="nav">
    <div class="wrap">
      <a class="brand" href="#"><img src="assets/icon.svg" alt="" width="34" height="34"><span class="brand-name">PushLife</span></a>
      <nav aria-label="Seções">
        <a href="#experimente" data-i18n="nav_try">Experimente</a>
        <a href="#como-funciona" data-i18n="nav_how">Como funciona</a>
        <a href="#exercicios" data-i18n="nav_ex">Exercícios</a>
        <a href="#programas" data-i18n="nav_packs">Programas</a>
        <a href="#duvidas" data-i18n="nav_faq">Dúvidas</a>
      </nav>
      <div class="lang" role="group" data-i18n-attr="aria-label:lang_label">
        <button type="button" data-set-lang="pt">PT</button><button type="button" data-set-lang="en">EN</button><button type="button" data-set-lang="es">ES</button>
      </div>
      <a class="btn btn-primary btn-small" href="#baixar" data-i18n="nav_download">Baixar</a>
    </div>
  </header>

  <div class="update-bar" id="updateBar" hidden>
    <div class="wrap">
      <span class="ub-dot" aria-hidden="true"></span>
      <p><b id="ubTitle"></b> <span id="ubNotes"></span></p>
      <a class="btn btn-primary btn-small" id="ubLink" target="_blank" rel="noopener" data-i18n="ub_button"></a>
      <button type="button" class="ub-close" id="ubClose" data-i18n-attr="aria-label:ub_close">×</button>
    </div>
  </div>
  <main id="conteudo">
    <!-- topo -->
    <section class="hero">
      <div class="glow" aria-hidden="true"></div>
      <div class="wrap hero-grid">
        <div>
          <h1 id="heroTitle"></h1>
          <p class="lead" data-i18n="hero_lead"></p>
          <div class="hero-cta">
            <a class="btn btn-primary" href="#baixar" data-i18n="hero_cta1"></a>
            <a class="btn btn-ghost" href="#experimente" data-i18n="hero_cta2"></a>
          </div>
          <div class="badges"><span data-i18n="badge1"></span><span data-i18n="badge2"></span><span data-i18n="badge3"></span></div>
        </div>
        <div class="float hero-phone">
          <span class="bubble b1" aria-hidden="true">+1 min</span>
          <span class="bubble b2" aria-hidden="true">💪</span>
          <span class="bubble b3" aria-hidden="true">+1 min</span>
          <div class="phone">
            <div class="screen">
              <video id="heroVideo" poster="assets/icon-512.png" autoplay muted loop playsinline preload="metadata" data-i18n-attr="aria-label:video_label"></video>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- faixa correndo -->
    <div class="marquee" aria-hidden="true"><div class="track" id="marquee"></div></div>

    <!-- arraste para fazer flexão -->
    <section class="section drag-section" id="experimente">
      <div class="wrap">
        <div class="section-head" data-reveal>
          <span class="eyebrow" data-i18n="try_eyebrow"></span>
          <h2 data-i18n="try_title"></h2>
          <p class="lead" data-i18n="try_lead"></p>
        </div>
        <div class="drag-grid" data-reveal>
          <div class="stage" id="stage">
            <div class="hud">
              <span class="chip"><span data-i18n="chip_reps"></span> <b id="reps">0</b></span>
              <span class="chip"><span data-i18n="chip_balance"></span> <b id="balance">0 min</b></span>
            </div>
            <svg viewBox="10 70 182 118" aria-hidden="true"><g id="figure"></g></svg>
          </div>
          <div>
            <div class="slider" id="slider" role="slider" tabindex="0" data-i18n-attr="aria-label:slider_label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="fill" id="fill"></div>
              <div class="handle" id="handle">↕</div>
            </div>
            <p class="drag-hint" id="dragHint"></p>
          </div>
        </div>
        <p class="drag-done center" id="dragMsg" aria-live="polite"></p>
      </div>
    </section>

    <!-- como funciona -->
    <section class="section" id="como-funciona">
      <div class="wrap">
        <div class="section-head" data-reveal>
          <span class="eyebrow" data-i18n="how_eyebrow"></span>
          <h2 data-i18n="how_title"></h2>
        </div>
        <div class="counters">
          <div data-reveal><b data-count="60">0</b><span data-i18n="stat1"></span></div>
          <div data-reveal><b data-count="10">0</b><span data-i18n="stat2"></span></div>
          <div data-reveal><b data-count="0">0</b><span data-i18n="stat3"></span></div>
          <div data-reveal><b data-count="0">0</b><span data-i18n="stat4"></span></div>
        </div>
        <div class="steps" id="steps">
          <div class="rail"><i id="rail"></i></div>
          <div class="step" data-reveal="right">
            <span class="num">1</span>
            <h3 data-i18n="step1_t"></h3>
            <p data-i18n="step1_p"></p>
          </div>
          <div class="step" data-reveal="right">
            <span class="num">2</span>
            <h3 data-i18n="step2_t"></h3>
            <p data-i18n="step2_p"></p>
          </div>
          <div class="step" data-reveal="right">
            <span class="num">3</span>
            <h3 data-i18n="step3_t"></h3>
            <p data-i18n="step3_p"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- celular bloqueado -->
    <section class="section block-section">
      <div class="wrap block-grid">
        <div data-reveal="left">
          <span class="eyebrow" data-i18n="block_eyebrow"></span>
          <h2 data-i18n="block_title"></h2>
          <p class="lead" style="margin-top:16px" data-i18n="block_lead"></p>
          <div class="balance-pill"><span data-i18n="balance_label"></span> <b id="balance2">0 min</b></div>
        </div>
        <div data-reveal="zoom">
          <div class="phone">
            <div class="screen" id="demoPhone">
              <div class="home" id="home"></div>
              <div class="blocker" id="blocker" role="dialog" aria-modal="false" aria-labelledby="blockTitle">
                <div class="big">⏳</div>
                <h4 id="blockTitle" data-i18n="blocker_title"></h4>
                <p id="blockText"></p>
                <button class="btn btn-primary" id="useBalance"></button>
                <a class="btn btn-line" href="#experimente" id="goTrain" data-i18n="train_btn"></a>
                <button class="btn btn-line" id="emergency" data-i18n="emergency_btn"></button>
                <button class="close" id="closeBlock" data-i18n="back_btn"></button>
              </div>
              <div class="toast" id="toast" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- exercícios -->
    <section class="section" id="exercicios">
      <div class="wrap">
        <div class="section-head center" data-reveal>
          <span class="eyebrow" data-i18n="ex_eyebrow"></span>
          <h2 data-i18n="ex_title"></h2>
          <p class="lead" data-i18n="ex_lead"></p>
        </div>
        <div class="cards" id="cards"></div>
      </div>
    </section>

    <!-- programas (packs) -->
    <section class="section" id="programas">
      <div class="wrap">
        <div class="section-head center" data-reveal>
          <span class="eyebrow" data-i18n="pk_eyebrow"></span>
          <h2 data-i18n="pk_title"></h2>
          <p class="lead" data-i18n="pk_lead"></p>
        </div>
        <div class="pack-tabs" role="tablist" data-reveal>
          <button type="button" role="tab" data-cat="strength" aria-selected="true" data-i18n="pk_strength"></button>
          <button type="button" role="tab" data-cat="challenge" aria-selected="false" data-i18n="pk_challenge"></button>
          <button type="button" role="tab" data-cat="stretch" aria-selected="false" data-i18n="pk_stretch"></button>
        </div>
        <div class="packs" id="packs" aria-live="polite"></div>

        <div class="ladder" data-reveal>
          <div class="ladder-text">
            <span class="eyebrow" data-i18n="ld_eyebrow"></span>
            <h3 data-i18n="ld_title"></h3>
            <p data-i18n="ld_lead"></p>
            <div class="ld-buttons">
              <button type="button" class="btn btn-line" data-fb="-0.5" data-i18n="ld_hard"></button>
              <button type="button" class="btn btn-line" data-fb="0.5" data-i18n="ld_ok"></button>
              <button type="button" class="btn btn-primary" data-fb="1" data-i18n="ld_easy"></button>
            </div>
          </div>
          <div class="ladder-demo">
            <div class="ld-fig"><svg id="ldFig" aria-hidden="true"></svg></div>
            <p class="ld-now" id="ldNow" aria-live="polite"></p>
            <ol class="ld-steps" id="ldSteps"></ol>
          </div>
        </div>

        <div class="pk-how">
          <div data-reveal><span class="emo">📅</span><h3 data-i18n="ph1_t"></h3><p data-i18n="ph1_p"></p></div>
          <div data-reveal><span class="emo">📈</span><h3 data-i18n="ph2_t"></h3><p data-i18n="ph2_p"></p></div>
          <div data-reveal><span class="emo">⏱️</span><h3 data-i18n="ph3_t"></h3><p data-i18n="ph3_p"></p></div>
          <div data-reveal><span class="emo">🎵</span><h3 data-i18n="ph4_t"></h3><p data-i18n="ph4_p"></p></div>
        </div>

        <div class="section-head center" data-reveal style="margin-top:56px">
          <span class="eyebrow" data-i18n="body_eyebrow"></span>
          <h2 data-i18n="body_title"></h2>
        </div>
        <div class="facts" id="facts"></div>
        <p class="sources" data-reveal data-i18n="body_sources"></p>
      </div>
    </section>

    <!-- calculadora -->
    <section class="section" style="padding-top:0">
      <div class="wrap">
        <div class="section-head center" data-reveal>
          <span class="eyebrow" data-i18n="calc_eyebrow"></span>
          <h2 data-i18n="calc_title"></h2>
        </div>
        <div class="calc" data-reveal="zoom">
          <label for="goal"><span data-i18n="calc_goal"></span> <output id="goalOut">1 h</output></label>
          <input type="range" id="goal" min="0.5" max="6" step="0.5" value="1">
          <label for="perDay"><span data-i18n="calc_label"></span> <output id="perDayOut">30</output></label>
          <input type="range" id="perDay" min="0" max="150" step="5" value="30">
          <div>
            <div class="daybar" aria-hidden="true"><span class="free" id="barFree"></span><span class="earned" id="barEarned"></span></div>
            <div class="legend" style="margin-top:10px"><span><i style="background:var(--yellow)"></i><span id="legendFree"></span></span><span><i style="background:var(--orange)"></i><span data-i18n="legend_earned"></span></span><span data-i18n="legend_cap"></span></div>
          </div>
          <div class="calc-out">
            <div class="stat"><b id="outDay">1 h 30 min</b><span data-i18n="out_day"></span></div>
            <div class="stat"><b id="outMonth">900</b><span data-i18n="out_month"></span></div>
            <div class="stat"><b id="outYear">10.950</b><span data-i18n="out_year"></span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- filtro -->
    <section class="section" style="padding-top:0">
      <div class="wrap">
        <div class="filter-card" data-reveal>
          <div>
            <span class="eyebrow" data-i18n="filter_eyebrow"></span>
            <h2 data-i18n="filter_title"></h2>
            <p class="lead" data-i18n="filter_lead"></p>
          </div>
          <div>
            <button class="switch" id="filterSwitch" role="switch" aria-checked="true" data-i18n-attr="aria-label:filter_aria"></button>
            <p class="switch-label" id="filterLabel" data-i18n="filter_on"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- privacidade -->
    <section class="section" style="padding-top:0">
      <div class="wrap">
        <div class="section-head center" data-reveal>
          <span class="eyebrow" data-i18n="trust_eyebrow"></span>
          <h2 data-i18n="trust_title"></h2>
        </div>
        <div class="trust">
          <div data-reveal><span class="emo">📷</span><h3 data-i18n="trust1_t"></h3><p data-i18n="trust1_p"></p></div>
          <div data-reveal><span class="emo">🚫</span><h3 data-i18n="trust2_t"></h3><p data-i18n="trust2_p"></p></div>
          <div data-reveal><span class="emo">🔐</span><h3 data-i18n="trust3_t"></h3><p data-i18n="trust3_p"></p></div>
        </div>
      </div>
    </section>

    <!-- dúvidas -->
    <section class="section" id="duvidas" style="padding-top:0">
      <div class="wrap">
        <div class="section-head center" data-reveal>
          <span class="eyebrow" data-i18n="faq_eyebrow"></span>
          <h2 data-i18n="faq_title"></h2>
        </div>
        <div class="faq" data-reveal>
          <details><summary data-i18n="faq1_q"></summary><p data-i18n="faq1_a"></p></details>
          <details><summary data-i18n="faq2_q"></summary><p data-i18n="faq2_a"></p></details>
          <details><summary data-i18n="faq3_q"></summary><p data-i18n="faq3_a"></p></details>
          <details><summary data-i18n="faq4_q"></summary><p data-i18n="faq4_a"></p></details>
          <details><summary data-i18n="faq5_q"></summary><p data-i18n="faq5_a"></p></details>
          <details><summary data-i18n="faq6_q"></summary><p data-i18n="faq6_a"></p></details>
          <details><summary data-i18n="faq7_q"></summary><p data-i18n="faq7_a"></p></details>
          <details><summary data-i18n="faq8_q"></summary><p data-i18n="faq8_a"></p></details>
        </div>
      </div>
    </section>

    <!-- baixar -->
    <section class="section download" id="baixar">
      <div class="wrap" data-reveal="zoom">
        <img class="icon-big" src="assets/icon.svg" data-i18n-attr="alt:dl_icon" width="110" height="110">
        <h2 data-i18n="dl_title"></h2>
        <p class="lead" data-i18n="dl_lead"></p>
        <a class="btn btn-dark" href="https://github.com/matheusasturofc-del/PushLife/releases/latest/download/PushLife.apk" data-i18n="dl_btn"></a>
        <p class="alt" data-i18n="dl_alt"></p>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <p class="made">PushLife · <span data-i18n="made"></span></p>
      <nav aria-label="Rodapé">
        <a href="termos.html" data-i18n="f_terms"></a>
        <a href="privacidade.html" data-i18n="f_priv"></a>
        <a href="excluir-conta.html" data-i18n="f_delete"></a>
        <a href="mailto:matheusasturofc@gmail.com" data-i18n="f_contact"></a>
      </nav>
    </div>
  </footer>

  <!-- desafio para desligar o filtro -->
  <div class="modal" id="challenge" role="dialog" aria-modal="true" aria-labelledby="chTitle">
    <div class="box">
      <h3 id="chTitle" data-i18n="ch_title"></h3>
      <p style="color:var(--muted);margin-top:8px" data-i18n="ch_body"></p>
      <div class="timer" id="chTimer">3:00</div>
      <ol>
        <li data-i18n="ch_l1"></li>
        <li data-i18n="ch_l2"></li>
        <li data-i18n="ch_l3"></li>
        <li data-i18n="ch_more"></li>
      </ol>
      <div class="row">
        <button class="btn btn-primary" id="chKeep" data-i18n="ch_keep"></button>
      </div>
    </div>
  </div>

  <script src="assets/i18n.js"></script>
  <script src="assets/figures.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
